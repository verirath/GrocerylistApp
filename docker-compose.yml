version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: grocery_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grocerylist
      MYSQL_USER: grocery
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocery_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://grocery:secret@db:3306/grocerylist?serverVersion=8.0"
      APP_ENV: dev
      APP_DEBUG: 1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend/einkauflisteApp
      dockerfile: Dockerfile
    container_name: grocery_frontend
    depends_on:
    - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/einkauflisteApp:/app
      - /app/node_modules

volumes:
  db_data:
